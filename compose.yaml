# Local preview of the exact production image:
#   docker compose up --build        → http://localhost:8080
# Same hardening as production (read-only filesystem, no capabilities, non-root).
services:
  site:
    build:
      context: .
      args:
        GIT_SHA: local
    image: portfolio-site:local
    ports:
      - 127.0.0.1:8080:8080
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=16m,mode=1777']
