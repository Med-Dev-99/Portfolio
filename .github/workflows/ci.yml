# CI/CD for mohamedelkorchi.com
#
#   pull request → type-check & build · secret scan · Docker image, smoke test, CVE scan
#   push to main → the same, then publish the image to GHCR and deploy it (blue/green) to the VPS
#
# Every action is pinned to a full commit SHA and every tool image to a digest.
# Deployment setup (secrets, variables, server): deploy/README.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: portfolio-site
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  GRYPE: anchore/grype:v0.121.3@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887

jobs:
  site:
    name: Type-check & build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: astro check + astro build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS" git /repo --redact --no-banner --exit-code 1

  image:
    name: Docker image · smoke test · CVE scan
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (production hardening)
        run: bash deploy/ci/smoke-test.sh "$IMAGE:$GITHUB_SHA" "$GITHUB_SHA"
      - name: Vulnerability scan (fixable High/Critical fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$GRYPE" "$IMAGE:$GITHUB_SHA" --only-fixed --fail-on high
      - name: Package the tested image for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "$IMAGE:$GITHUB_SHA" | gzip -n > portfolio-image.tar.gz
      - name: Keep the image for the deploy job
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-image-${{ github.sha }}
          path: portfolio-image.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Publish to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$GITHUB_SHA" latest; do
            docker tag "$IMAGE:$GITHUB_SHA" "$registry:$tag"
            docker push --quiet "$registry:$tag"
          done
          docker logout ghcr.io

  deploy:
    name: Deploy to production
    needs: [image, secrets]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://mohamedelkorchi.com
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-image-${{ github.sha }}
      - name: Ship, switch blue/green, verify
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash deploy/ci/deploy.sh portfolio-image.tar.gz "$GITHUB_SHA"
