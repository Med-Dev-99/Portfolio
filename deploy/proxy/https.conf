    # >>> portfolio: mohamedelkorchi.com (https) >>> managed by github.com/Med-Dev-99/Portfolio deploy/
    server {
        listen 8443 ssl;
        http2 on;
        server_name www.mohamedelkorchi.com;
        ssl_certificate /etc/letsencrypt/live/mohamedelkorchi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mohamedelkorchi.com/privkey.pem;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
        location / { return 308 https://mohamedelkorchi.com$request_uri; }
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name mohamedelkorchi.com;
        ssl_certificate /etc/letsencrypt/live/mohamedelkorchi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mohamedelkorchi.com/privkey.pem;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        # Certificate renewals keep working even if Cloudflare redirects HTTP to HTTPS.
        location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
        location / {
            # Resolved per request, so the proxy keeps running even if the portfolio container is down.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $portfolio_upstream http://portfolio-site:8080;
            proxy_pass $portfolio_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
    # <<< portfolio (https) <<<
