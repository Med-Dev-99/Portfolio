# Static server baked into the portfolio image (Alpine nginx as a non-root user, read-only root filesystem).
# TLS, HSTS and HTTP→HTTPS are handled by the host's reverse proxy in front of it.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    access_log off;
    absolute_redirect off;
    client_max_body_size 1k;

    # Files are pre-compressed in the image build (.gz next to each file); on-the-fly gzip is the fallback.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain application/speculationrules+json;

    map $uri $cache_control {
        /version.txt                     "no-store";   # revision of the running image, checked after each deploy
        ~^/_astro/                       "public, max-age=31536000, immutable";
        ~^/images/                       "public, max-age=2592000";
        ~\.(?:woff2|svg|png|ico)$        "public, max-age=604800";
        ~^/resume/                       "public, max-age=3600";
        default                          "public, max-age=0, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;
        # The built site is copied into the image; a deploy replaces the whole container.
        root /srv/site;
        index index.html;
        etag on;

        set $csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        # Instant navigation: the browser prerenders internal pages on hover (Speculation Rules API).
        add_header Speculation-Rules '"/speculation-rules.json"' always;

        location = /healthz { access_log off; default_type text/plain; return 200 'ok';  }

        location = /speculation-rules.json {
            types { }
            default_type application/speculationrules+json;
        }

        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
