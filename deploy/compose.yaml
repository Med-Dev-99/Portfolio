# Portfolio site: installed on the VPS at /opt/portfolio (see deploy/README.md).
# The existing FIREBRIDGE proxy terminates TLS and forwards mohamedelkorchi.com here
# over the shared Docker network; no host port is published.
name: portfolio

services:
  site:
    image: nginxinc/nginx-unprivileged:1.29.8-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=16m,mode=1777']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/srv:ro
    networks:
      web:
        aliases: [portfolio-site]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: '5m', max-file: '2'}

networks:
  web:
    external: true
    name: firebridge-webapp_web
